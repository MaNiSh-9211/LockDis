[workspace]
resolver = "3"
members = [
    "crates/palisade-core",
    "crates/palisade-redis",
    "crates/palisade-proto",
    "crates/palisade-server",
    "crates/palisade-client",
    "crates/palisade-testing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://example.com/palisade"
authors = ["Palisade Contributors"]

[workspace.dependencies]
palisade-core = { path = "crates/palisade-core" }
palisade-redis = { path = "crates/palisade-redis" }
palisade-proto = { path = "crates/palisade-proto" }
palisade-server = { path = "crates/palisade-server" }
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
tokio = { version = "1", features = ["full"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
async-trait = "0.1"
metrics = "0.24"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"
tonic-health = "0.14"
prost = "0.14"
protoc-bin-vendored = "3"
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rcgen = "0.13"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
