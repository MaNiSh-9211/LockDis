[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/redis",
    "crates/etcd",
    "crates/proto",
    "crates/server",
    "crates/client",
    "crates/testing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://example.com/palisade"
authors = ["Palisade Contributors"]

[workspace.dependencies]
palisade-core = { path = "crates/core" }
palisade-redis = { path = "crates/redis" }
palisade-etcd = { path = "crates/etcd" }
palisade-proto = { path = "crates/proto" }
palisade-server = { path = "crates/server" }
palisade-testing = { path = "crates/testing" }
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
tokio = { version = "1", features = ["full"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
async-trait = "0.1"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"
tonic-health = "0.14"
prost = "0.14"
protoc-bin-vendored = "3"
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rcgen = "0.13"
proptest = "1"
anyhow = "1"
criterion = { version = "0.7", features = ["async_tokio"] }
etcd-client = "0.19"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
