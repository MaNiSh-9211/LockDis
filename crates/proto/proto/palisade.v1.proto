syntax = "proto3";

package palisade.v1;

// Distributed locking service. Expected outcomes (held, timed out, lost)
// are modeled as oneof results; infrastructure failures use gRPC status
// codes. Watchers never receive holder tokens (ADR 0022).
service LockService {
  // Immediate acquisition attempt.
  rpc TryLock(TryLockRequest) returns (LockOutcome);
  // Acquisition with bounded waiting.
  rpc TryLockFor(TryLockForRequest) returns (LockOutcome);
  // Ownership-checked release.
  rpc Unlock(UnlockRequest) returns (UnlockResponse);
  // Ownership-checked lease refresh.
  rpc Extend(ExtendRequest) returns (ExtendResponse);
  // Stream of anonymized state changes for one key.
  rpc Watch(WatchRequest) returns (stream LockEvent);
  // Server-authoritative sessions (ADR 0027): locks bound to a session are
  // released by the server when heartbeats stop — a crashed client's locks
  // die with it instead of living out their TTL.
  rpc RegisterSession(RegisterSessionRequest) returns (RegisterSessionResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  // Admin-only break-glass release without ownership check. Audited (ADR 0028).
  rpc UnlockForce(UnlockForceRequest) returns (UnlockForceResponse);
  // Admin introspection: enumerate held keys under a prefix (ADR 0030).
  rpc ListLocks(ListLocksRequest) returns (stream KeyState);
}

message LockOptions {
  uint64 ttl_ms = 1;
  optional bool watchdog = 2;
}

message TryLockRequest {
  string key = 1;
  LockOptions options = 2;
  // Optional session token from RegisterSession; binds this lock to the
  // session so the server releases it if the session dies.
  string session = 3;
}

message TryLockForRequest {
  string key = 1;
  LockOptions options = 2;
  uint64 wait_ms = 3;
  string session = 4;
}

message Granted {
  string token = 1;
  uint64 fencing_token = 2;
  uint64 ttl_ms = 3;
}

message Held {
  string key = 1;
}

message TimedOut {
  string key = 1;
}

message LockOutcome {
  oneof result {
    Granted granted = 1;
    Held held = 2;
    TimedOut timed_out = 3;
  }
}

message UnlockRequest {
  string key = 1;
  string token = 2;
}

message Released {}

message Lost {
  uint64 fencing_token = 1;
}

message UnlockResponse {
  oneof result {
    Released released = 1;
    Lost lost = 2;
  }
}

message ExtendRequest {
  string key = 1;
  string token = 2;
  uint64 ttl_ms = 3;
}

message Extended {}

message ExtendResponse {
  oneof result {
    Extended extended = 1;
    Lost lost = 2;
  }
}

message WatchRequest {
  string key = 1;
}

message RegisterSessionRequest {
  string client_id = 1;
  uint64 ttl_ms = 2;
}

message RegisterSessionResponse {
  string session_token = 1;
  uint64 ttl_ms = 2;
}

message HeartbeatRequest {
  string session_token = 1;
}

message HeartbeatResponse {}

message CloseSessionRequest {
  string session_token = 1;
}

message CloseSessionResponse {
  uint32 released_locks = 1;
}

message UnlockForceRequest {
  string key = 1;
}

message UnlockForceResponse {
  bool released = 1;
}

message ListLocksRequest {
  string prefix = 1;
}

message KeyState {
  string key = 1;
  bool held = 2;
  uint64 ttl_ms = 3;
}

message Acquired {}

message Freed {}

message LockEvent {
  oneof event {
    Acquired acquired = 1;
    Freed freed = 2;
  }
}
