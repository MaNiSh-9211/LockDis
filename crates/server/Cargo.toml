[package]
publish = false
name = "palisade-server"
description = "Standalone gRPC lock service exposing Palisade semantics to any language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "palisade_server"
path = "src/lib.rs"

[[bin]]
name = "palisade-server"
path = "src/main.rs"

[dependencies]
palisade-core.workspace = true
palisade-redis.workspace = true
palisade-proto.workspace = true
tonic.workspace = true
tonic-health.workspace = true
rustls.workspace = true
prost.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["fs"] }
redis.workspace = true

[dev-dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30.0"

