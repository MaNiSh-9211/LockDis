      </span>

  <div class="max-w-7xl mx-auto px-4 pb-2 flex gap-1.5 flex-wrap" id="tabbar"></div>

<!-- ── Main ───────────────────────────────────────────────────────── -->
<main class="max-w-7xl mx-auto px-4 py-4">

  <!-- Shared event log -->
  <div class="mt-4 rounded-xl border border-slate-800 bg-slate-900/40 p-3">

      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500">Event log</h2>

    </div>
    <div id="log" class="space-y-0.5 max-h-56 overflow-y-auto font-mono text-[11px] leading-relaxed pr-1"></div>
  </div>
</main>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const LOG_KINDS = { grant:"text-emerald-300", release:"text-sky-300", lost:"text-rose-300",
  wait:"text-amber-300", peer:"text-violet-300", info:"text-slate-500", error:"text-rose-400", ok:"text-emerald-300" };
function log(kind, msg) {
  const t = new Date();
  const ts = `${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}:${String(t.getSeconds()).padStart(2,"0")}.${String(t.getMilliseconds()).padStart(3,"0")}`;
  const row = document.createElement("div");
  row.className = LOG_KINDS[kind] || LOG_KINDS.info;
  row.textContent = `${ts}  ${msg}`;
  const box = $("#log"); box.prepend(row);
  while (box.childElementCount > 200) box.lastElementChild.remove();
}
$("#clearLogBtn").onclick = () => ($("#log").innerHTML = "");

async function api(method, path, body) {
  try {
    const res = await fetch(path, {
      method,
      headers: body ? { "content-type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await res.json().catch(() => ({ error: "non-json response" }));
    return j;
  } catch (e) { return { error: String(e) }; }
}
const post = (path, body) => api("POST", path, body);

/* ── generic panel machinery ──────────────────────────────────────── */
const TABS = [];
function tab(id, label, html) { TABS.push({ id, label, html }); }

function field(label, id, type = "text", value = "", extra = "") {
  return `<label class="block"><span class="text-[10px] uppercase tracking-wider text-slate-500">${label}</span>
    <input id="${id}" type="${type}" value="${value}" ${extra}
    class="mt-0.5 w-full bg-slate-900 border border-slate-700 focus:border-emerald-600 rounded-lg px-2.5 py-1.5 text-sm font-mono text-slate-100 outline-none transition-colors"></label>`;
}
function btn(id, label, cls = "emerald") {
  const c = { emerald: "bg-emerald-600/20 border-emerald-600/50 text-emerald-300 hover:bg-emerald-600/30",
              slate: "bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700",
              rose: "bg-rose-600/15 border-rose-600/40 text-rose-300 hover:bg-rose-600/25" }[cls];
  return `<button id="${id}" class="px-3 py-1.5 text-xs font-semibold rounded-lg border ${c} transition-colors">${label}</button>`;
}
function out(id) {
  return `<pre id="${id}" class="mt-2 text-[11px] font-mono text-slate-400 bg-slate-950/60 border border-slate-800 rounded-lg p-2.5 max-h-44 overflow-auto whitespace-pre-wrap">—</pre>`;
}
function card(title, subtitle, inner) {
  return `<div class="rounded-xl border border-slate-800 bg-slate-900/40 p-4">
    <h3 class="text-sm font-semibold text-slate-200">${title}</h3>
    <p class="text-[11px] text-slate-500 mb-3">${subtitle}</p>${inner}</div>`;
}
function show(id, obj) { $(id).textContent = JSON.stringify(obj, null, 2); }

/* ══ TAB: Mutex (worker grid) ═════════════════════════════════════ */
tab("mutex", "Mutex", `

    <span class="text-[10px] uppercase tracking-wider text-slate-500">key</span>
    <input id="mKey" value="demo:orders" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-sm font-mono text-slate-100 w-52 outline-none">

    <span class="ml-auto inline-flex items-center gap-2 text-xs text-slate-400">
      <span id="keyDot" class="w-2 h-2 rounded-full bg-slate-600 pulse-ring"></span><span id="keyStateText">free</span><span id="keyVersion" class="font-mono text-[10px] text-slate-600"></span>
    </span>

  <div id="contentionBanner" class="hidden mb-3 rounded-xl border border-amber-500/40 bg-amber-500/10 px-4 py-2 text-sm text-amber-300">

`);

/* ── render tabs + panels ─────────────────────────────────────────── */
const bar = $("#tabbar"), panels = $("#panels");
TABS.forEach((t, i) => {
  const b = document.createElement("button");
  b.className = "tabbtn px-3 py-1 text-xs font-semibold rounded-lg border border-slate-800 bg-slate-900/60 text-slate-400 hover:text-slate-200 transition-colors";
  b.textContent = t.label; b.dataset.tab = t.id;
  b.onclick = () => {
    document.querySelectorAll(".tabbtn").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    document.querySelectorAll(".panel").forEach((p) => p.classList.add("hidden"));
    $(`#panel-${t.id}`).classList.remove("hidden");
  };
  bar.appendChild(b);
  const p = document.createElement("div");
  p.id = `panel-${t.id}`; p.className = "panel" + (i ? " hidden" : "");
  p.innerHTML = t.html; panels.appendChild(p);
});
bar.firstChild.classList.add("active");

/* ── mutex tab logic ─────────────────────────────────────────────── */
const HUES = [160, 265, 330, 42, 199, 12, 115, 290, 232, 350, 84, 187];
const M = { key: "demo:orders", workers: [], nextId: 1, chaos: false, chaosTimer: null, lastGrant: 0, seen: new Set(), ws: null };

function mOpts() {
  M.key = $("#mKey").value.trim() || M.key;
  return { key: M.key, ttl_ms: Number($("#mTtl").value) || 4000,
    watchdog: $("#mWd").value === "true", safety_policy: $("#mPolicy").value };
}
$("#mApply").onclick = () => { mOpts(); log("info", `mutex settings → key="${M.key}"`); connectWatch(); refreshKey(); };

function workerCard(w) {
  const el = document.createElement("div");
  el.className = "rounded-xl border border-slate-800 bg-slate-900/60 overflow-hidden";
  el.innerHTML = `
    <div class="h-1" style="background:hsl(${w.hue},75%,55%)"></div>
    <div class="p-3 space-y-2.5">
      <div class="flex items-center justify-between gap-2">
        <span class="font-mono text-sm font-semibold" style="color:hsl(${w.hue},80%,68%)">worker-${String(w.id).padStart(2,"0")}</span>
        <span class="js-status text-[10px] font-bold tracking-wider px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">IDLE</span>
      </div>
      <div class="flex items-baseline justify-between font-mono text-xs">
        <span class="js-fence text-slate-500">fence —</span><span class="js-ttl text-slate-600"></span>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button class="js-acq py-1.5 rounded-lg text-xs font-semibold bg-emerald-600/15 border border-emerald-600/40 text-emerald-300 hover:bg-emerald-600/25 transition-colors">Acquire</button>
        <button class="js-rel py-1.5 rounded-lg text-xs font-semibold bg-slate-800 border border-slate-700 text-slate-400 hover:bg-slate-700 disabled:opacity-40 transition-colors" disabled>Release</button>
      </div>
    </div>`;
  el.querySelector(".js-acq").onclick = () => mAcquire(w);
  el.querySelector(".js-rel").onclick = () => mRelease(w);
  return el;
}
const ST = { idle:"bg-slate-800 text-slate-400", held:"bg-emerald-500/20 text-emerald-300", waiting:"bg-amber-500/20 text-amber-300 animate-pulse", lost:"bg-rose-500/20 text-rose-300" };
function mSetStatus(w, s) {
  w.status = s;
  const pill = w.el.querySelector(".js-status");
  pill.className = `js-status text-[10px] font-bold tracking-wider px-2 py-0.5 rounded-full ${ST[s]}`;
  pill.textContent = s.toUpperCase();
  w.el.querySelector(".js-acq").disabled = s === "held";
  w.el.querySelector(".js-acq").textContent = s === "waiting" ? "Stop retry" : s === "held" ? "Held" : "Acquire";
  w.el.querySelector(".js-rel").disabled = s !== "held";
  if (s === "idle") { w.el.querySelector(".js-fence").textContent = "fence —"; w.el.querySelector(".js-fence").className = "js-fence text-slate-500"; w.el.querySelector(".js-ttl").textContent = ""; }
  mContention();
}
function mAdd() { if (M.workers.length >= 12) return;
  const w = { id: M.nextId++, hue: HUES[(M.nextId-2)%HUES.length], status:"idle", token:null, fence:0, exp:0, timer:null, el:null };
  w.el = workerCard(w); $("#workers").appendChild(w.el); M.workers.push(w); }
function mRm() { if (M.workers.length <= 1) return;
  const w = M.workers.pop(); mStopRetry(w);
  if (w.token) post("/api/unlock", { key: M.key, token: w.token });
  w.el.remove(); mContention(); }
function mStopRetry(w) { if (w.timer) { clearTimeout(w.timer); w.timer = null; } }
$("#addW").onclick = mAdd; $("#rmW").onclick = mRm;

async function mAcquire(w) {
  if (w.status === "held") return;
  if (w.status === "waiting") { mStopRetry(w); mSetStatus(w,"idle"); log("info",`worker-${w.id} gave up`); return; }
  mSetStatus(w, "waiting");
  log("wait", `worker-${w.id} → TRY LOCK "${M.key}"`);
  mAttempt(w);
}
async function mAttempt(w) {
  const r = await post("/api/lock", mOpts());
  if (r.result === "granted") {
    w.token = r.token; w.fence = r.fence; w.exp = performance.now() + r.ttl_ms; M.lastGrant = Date.now();
    mSetStatus(w, "held");
    w.el.querySelector(".js-fence").textContent = `fence #${r.fence}`;
    w.el.querySelector(".js-fence").className = "js-fence text-emerald-300";
    log("grant", `GRANTED → worker-${w.id} holds "${M.key}" · fence #${r.fence}${r.watchdog ? " · watchdog" : ""}`);
    tlPush(r.fence); refreshKey();
  } else if (r.result === "held") {
    if (!w.timer) log("wait", `DENIED → "${M.key}" held · worker-${w.id} retrying…`);
    w.timer = setTimeout(() => { w.timer = null; if (w.status === "waiting") mAttempt(w); }, 550);
    refreshKey();
  } else { mSetStatus(w,"lost"); log("error", `ERROR → ${r.error || "backend failure"}`); }
}
async function mRelease(w) {
  mStopRetry(w);
  if (!w.token) { mSetStatus(w,"idle"); return; }
  const token = w.token, fence = w.fence; w.token = null;
  const r = await post("/api/unlock", { key: M.key, token });
  if (r.result === "released") { mSetStatus(w,"idle"); log("release", `RELEASED → worker-${w.id} freed "${M.key}" · was fence #${fence}`); }
  else if (r.result === "lost") mLost(w, "token no longer owns the lock");
  else { mSetStatus(w,"idle"); log("error", `ERROR → ${r.error || "unlock failed"}`); }
  refreshKey();
}
function mLost(w, why) {
  mStopRetry(w); w.token = null; mSetStatus(w,"lost");
  w.el.querySelector(".js-fence").textContent = `fence #${w.fence} LOST`;
  w.el.querySelector(".js-fence").className = "js-fence text-rose-300";
  log("lost", `LOST → worker-${w.id} lost "${M.key}" (${why})`);
  setTimeout(() => { if (w.status === "lost") mSetStatus(w,"idle"); }, 2500);
}
setInterval(() => {
  const now = performance.now();
  for (const w of M.workers) if (w.status === "held") {
    const left = Math.max(0, (w.exp - now) / 1000);
    w.el.querySelector(".js-ttl").textContent = `${left.toFixed(1)}s`;
    if (left <= 0) mLost(w, "lease expired (no watchdog)");
  }
}, 100);
function mContention() {
  const n = M.workers.filter((w) => w.status === "waiting").length;
  $("#contentionBanner").classList.toggle("hidden", n < 2);
  $("#contentionCount").textContent = n;
}
function tlPush(fence) {
  if (M.seen.has(fence)) return; M.seen.add(fence);
  const chips = [fence, ...[...M.seen].filter((f) => f !== fence)].slice(0, 24);
  $("#timeline").textContent = chips.map((f) => `#${f}`).join(" → ");
}
$("#chaosB").onclick = () => {
  M.chaos = !M.chaos; const b = $("#chaosB");
  b.className = M.chaos
    ? "px-3 py-1.5 text-xs font-semibold rounded-lg border bg-amber-500/20 border-amber-500/50 text-amber-300 transition-colors"
    : "px-3 py-1.5 text-xs font-semibold rounded-lg border bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700 transition-colors";
  if (M.chaos) { log("info","chaos ON");
    M.chaosTimer = setInterval(() => {
      if (!M.workers.length) return;
      const w = M.workers[Math.floor(Math.random() * M.workers.length)];
      if (w.status === "idle") mAcquire(w);
      else if (w.status === "held" && Math.random() < 0.6) mRelease(w);
    }, 650);
  } else { clearInterval(M.chaosTimer); log("info","chaos OFF"); }
};

/* ── key state + ws ──────────────────────────────────────────────── */
async function refreshKey() {
  try {
    const d = await api("GET", `/api/describe/${encodeURIComponent(M.key)}`);
    $("#keyStateText").textContent = d.held ? `HELD · ${(d.ttl_ms/1000).toFixed(1)}s` : "free";
    $("#keyDot").className = `w-2 h-2 rounded-full ${d.held ? "bg-emerald-400" : "bg-slate-600"} pulse-ring`;
    $("#keyVersion").textContent = d.version ? `v${d.version}` : "";
  } catch (_) {}
}
setInterval(refreshKey, 1000);

function setWs(state, text) {
  const c = { live:"bg-emerald-400", down:"bg-rose-400", idle:"bg-slate-500" }[state];
  $("#wsDot").className = `w-1.5 h-1.5 rounded-full ${c} pulse-ring`;
  $("#wsPill").lastElementChild.textContent = text;
}
function connectWatch() {
  if (M.ws) { M.ws.onclose = null; M.ws.close(); M.ws = null; }
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/api/watch/${encodeURIComponent(M.key)}`);
  M.ws = ws; setWs("idle","connecting…");
  ws.onopen = () => setWs("live", `watch: ${M.key}`);
  ws.onmessage = (msg) => {
    let ev; try { ev = JSON.parse(msg.data); } catch (_) { return; }
    if (ev.event === "acquired") { tlPush(ev.version);
      if (Date.now() - M.lastGrant > 500) log("peer", `WATCH → "${M.key}" ACQUIRED v${ev.version}`); }
    else if (ev.event === "freed") {
      const holders = M.workers.filter((w) => w.status === "held");
      if (holders.length) holders.forEach((w) => mLost(w, "freed event from store"));
      else log("peer", `WATCH → "${M.key}" FREED v${ev.version}`);
    }
    refreshKey();
  };
  ws.onclose = () => { setWs("down","disconnected"); setTimeout(() => { if (!M.ws || M.ws === ws) connectWatch(); }, 1500); };
}

/* ── extend / admin ──────────────────────────────────────────────── */
$("#exGo").onclick = async () => { const r = await post("/api/extend", { key: $("#exKey").value.trim(), token: $("#exToken").value.trim(), ttl_ms: Number($("#exTtl").value) || 4000 }); show("#exOut", r); log(r.result === "extended" ? "ok" : "wait", `extend → ${r.result}`); };
$("#fuGo").onclick = async () => { const r = await post("/api/force-unlock", { key: $("#fuKey").value.trim() }); show("#fuOut", r); log("lost", `force-unlock "${$("#fuKey").value.trim()}" → released=${r.released}`); };
$("#lpGo").onclick = async () => { const r = await api("GET", `/api/locks?prefix=${encodeURIComponent($("#lpPrefix").value.trim())}`); show("#lpOut", r); log("info", `scan "${$("#lpPrefix").value.trim()}*" → ${r.locks?.length ?? "?"} keys`); };

/* ── rw ──────────────────────────────────────────────────────────── */
$("#rwR").onclick = async () => { const r = await post("/api/rw/read", { key: $("#rwKey").value.trim(), ttl_ms: Number($("#rwTtl").value) }); show("#rwOut", r); if (r.result === "acquired") log("grant", `READ lock fence #${r.fence}`); else log("wait", `read → ${r.result || r.error}`); };
$("#rwW").onclick = async () => { const r = await post("/api/rw/write", { key: $("#rwKey").value.trim(), ttl_ms: Number($("#rwTtl").value) }); show("#rwOut", r); if (r.result === "acquired") log("grant", `WRITE lock fence #${r.fence}`); else log("wait", `write → ${r.result || r.error} (readers exclude writers)`); };
$("#rwRel").onclick = async () => { const r = await post("/api/rw/release", { key: $("#rwRKey").value.trim(), fence: Number($("#rwRFence").value), mode: $("#rwModeSel")?.value || (Number($("#rwRFence").dataset.mode) || "read") }); show("#rwRelOut", r); log("release", `rw release → released=${r.released}`); };
$("#rwDesc").onclick = async () => { const r = await api("GET", `/api/describe/${encodeURIComponent($("#rwDKey").value.trim())}`); show("#rwDescOut", r); };

/* ── semaphore ───────────────────────────────────────────────────── */
$("#smGo").onclick = async () => { const r = await post("/api/semaphore/acquire", { key: $("#smKey").value.trim(), max_permits: Number($("#smMax").value) || 3, ttl_ms: Number($("#smTtl").value) }); show("#smOut", r); log(r.result === "acquired" ? "grant" : "wait", `semaphore → ${r.result}${r.fence ? ` fence #${r.fence}` : ""}`); };
$("#smRel").onclick = async () => { const r = await post("/api/semaphore/release", { key: $("#smRKey").value.trim(), fence: Number($("#smRFence").value) }); show("#smRelOut", r); log("release", `semaphore release → ${r.released}`); };
$("#smDesc").onclick = async () => { const r = await api("GET", `/api/describe/${encodeURIComponent($("#smKey").value.trim())}`); show("#smOut", r); };

/* ── reentrant ───────────────────────────────────────────────────── */
$("#reGo").onclick = async () => { const r = await post("/api/reentrant/acquire", { key: $("#reKey").value.trim(), ttl_ms: 5000 }); show("#reOut", r); if (r.owner_id) { $("#reOwner").value = r.owner_id; log("grant", `reentrant acquire owner=${r.owner_id.slice(0,8)}… fence #${r.fence}`); } else log("wait", `reentrant → ${r.error || "held"}`); };
$("#reRel").onclick = async () => { const r = await post("/api/reentrant/release", { key: $("#reKey").value.trim(), owner_id: $("#reOwner").value.trim(), all: false }); show("#reOut", r); log("release", `reentrant release-one → ${r.released}`); };
$("#reRelAll").onclick = async () => { const r = await post("/api/reentrant/release", { key: $("#reKey").value.trim(), owner_id: $("#reOwner").value.trim(), all: true }); show("#reOut", r); log("release", `reentrant release-all → ${r.released}`); };

/* ── fair ────────────────────────────────────────────────────────── */
$("#faGo").onclick = async () => { const r = await post("/api/fair/lock", { key: $("#faKey").value.trim(), ttl_ms: Number($("#faTtl").value) }); show("#faOut", r); if (r.fence) log("grant", `fair grant fence #${r.fence}`); else log("wait", `fair queued → ${r.error || "waiting"}`); };
$("#faRel").onclick = async () => { const r = await post("/api/fair/release", { key: $("#faRKey").value.trim(), fence: Number($("#faRFence").value) }); show("#faRelOut", r); log("release", `fair release → ${r.released} (next in line gets the handoff)`); };

/* ── multi ───────────────────────────────────────────────────────── */
$("#muGo").onclick = async () => {
  const keys = $("#muKeys").value.split(",").map((s) => s.trim()).filter(Boolean);
  const r = await post("/api/multi/lock", { keys, ttl_ms: Number($("#muTtl").value), wait_ms: Number($("#muWait").value) });
  show("#muOut", r);
  if (r.result === "acquired") { $("#muRId").value = r.multi_id; log("grant", `multi acquired ${r.locks.length} keys atomically (id ${r.multi_id.slice(0,8)}…)`); }
  else log("wait", `multi → ${r.result || r.error}`);
};
$("#muRel").onclick = async () => { const r = await post("/api/multi/release", { multi_id: $("#muRId").value.trim() }); show("#muRelOut", r); log("release", `multi release-all → ${r.released}`); };

/* ── latch ───────────────────────────────────────────────────────── */
$("#lcGo").onclick = async () => { const r = await post("/api/latch/create", { key: $("#lcKey").value.trim(), count: Number($("#lcCount").value) }); show("#lcOut", r); log("ok", `latch created count=${r.count}`); };
$("#lcdGo").onclick = async () => { const r = await post("/api/latch/count-down", { key: $("#lcdKey").value.trim() }); show("#lcdOut", r); log("ok", `count-down → remaining ${r.count}`); };
$("#lcqGo").onclick = async () => { const r = await api("GET", `/api/latch/count/${encodeURIComponent($("#lcdKey").value.trim())}`); show("#lcdOut", r); };
$("#lcwGo").onclick = async () => { log("info","latch wait…"); const r = await post("/api/latch/wait", { key: $("#lcwKey").value.trim(), timeout_ms: Number($("#lcwTo").value) }); show("#lcwOut", r); log(r.zero ? "ok" : "wait", `latch wait → zero=${r.zero}`); };

/* ── semantic ────────────────────────────────────────────────────── */
$("#sdSet").onclick = async () => { const r = await post("/api/semantic/data", { key: $("#sdKey").value.trim(), field: $("#sdField").value.trim(), value: $("#sdValue").value }); show("#sdOut", r); log("ok", `HSET ${$("#sdKey").value.trim()}.${$("#sdField").value.trim()} = ${$("#sdValue").value}`); };
$("#sdGet").onclick = async () => { const r = await api("GET", `/api/semantic/data/${encodeURIComponent($("#sdKey").value.trim())}`); show("#sdOut", r); };
$("#saGo").onclick = async () => {
  const preds = [{ field: $("#saF1").value.trim(), op: $("#saOp1").value, value: $("#saV1").value.trim() || null }];
  const f2 = $("#saF2").value.trim();
  if (f2) preds.push({ field: f2, op: $("#saOp2").value, value: $("#saV2").value.trim() || null });
  const r = await post("/api/semantic/acquire", { key: $("#saKey").value.trim(), ttl_ms: 5000, predicates: preds });
  show("#saOut", r);
  log(r.result === "granted" ? "grant" : "wait", `semantic → ${r.result}${r.fence ? ` fence #${r.fence}` : ""} (predicates evaluated inside the grant script)`);
};

/* ── testament ───────────────────────────────────────────────────── */
$("#tsGo").onclick = async () => { const r = await post("/api/testament/set", { key: $("#tsKey").value.trim(), token: $("#tsToken").value.trim(), ttl_ms: Number($("#tsTtl").value), payload: $("#tsPayload").value }); show("#tsOut", r); log("ok", `testament set → stored=${r.stored}`); };
$("#trGo").onclick = async () => { const r = await api("GET", `/api/testament/${encodeURIComponent($("#trKey").value.trim())}`); show("#trOut", r); log("info", `testament read → ${r.payload ? `"${r.payload}"` : "none"}`); };

/* ── sessions ────────────────────────────────────────────────────── */
$("#seGo").onclick = async () => { const r = await post("/api/session/register", { client_id: $("#seClient").value.trim(), ttl_ms: Number($("#seTtl").value) }); show("#seOut", r); if (r.session_token) { $("#seHb").value = r.session_token; $("#seCl").value = r.session_token; $("#sbToken").value = r.session_token; log("ok", `session registered ttl=${r.ttl_ms}ms token=${r.session_token.slice(0,8)}…`); } };
$("#seHbGo").onclick = async () => { const r = await post("/api/session/heartbeat", { key: $("#seHb").value.trim() }); show("#seHbOut", r); log(r.result === "ok" ? "ok" : "wait", `heartbeat → ${r.result}`); };
$("#seClGo").onclick = async () => { const r = await post("/api/session/close", { key: $("#seCl").value.trim() }); show("#seClOut", r); log("release", `session close → released ${r.released_locks} bound locks`); };
$("#sbGo").onclick = async () => { const r = await post("/api/lock", { key: $("#sbKey").value.trim(), ttl_ms: 6000, session_token: $("#sbToken").value.trim() }); show("#sbOut", r); log(r.result === "granted" ? "grant" : "error", `session-bound lock → ${r.result} ${r.fence ? `fence #${r.fence}` : r.error || ""}`); };

/* ── watch tab ───────────────────────────────────────────────────── */
$("#wOpen").onclick = () => { const k = $("#wKey").value.trim(); connectWatch(); log("info", `watch stream → "${k}" (events land in the log)`); };
$("#wClose").onclick = () => { if (M.ws) { M.ws.close(); M.ws = null; setWs("idle","ws idle"); log("info","watch closed"); } };
$("#dGo").onclick = async () => { const r = await api("GET", `/api/describe/${encodeURIComponent($("#dKey").value.trim())}`); show("#dOut", r); };

/* ── SPI ─────────────────────────────────────────────────────────── */
const TIER_COLOR = { NORMAL: "#34d399", ELEVATED: "#fbbf24", CRITICAL: "#fb923c", SIEGE: "#fb7185" };
async function pollPressure() {
  try {
    const p = await api("GET", "/api/pressure");
    $("#spiValue").textContent = Math.round(p.spi);
    $("#spiArc").setAttribute("stroke-dashoffset", String(251.4 * (1 - p.spi / 100)));
    $("#spiArc").setAttribute("stroke", TIER_COLOR[p.tier] || "#34d399");
    $("#spiTier").textContent = p.tier; $("#spiTier").style.color = TIER_COLOR[p.tier] || "";
  } catch (_) {}
}
setInterval(pollPressure, 1200);

/* ── boot ────────────────────────────────────────────────────────── */
mAdd(); mAdd(); mAdd();
connectWatch(); refreshKey(); pollPressure();
log("info", "console ready — every tab talks to the real backend");
</script>
