# Create the TLS secret expected by deployment.yaml (cert-manager or manual):
#
#   kubectl create secret generic palisade-server-tls \
#     --from-file=tls.crt=server.pem \
#     --from-file=tls.key=server-key.pem \
#     --from-file=ca.crt=ca.pem
#
# cert-manager Certificate example (mutual TLS with client CA):
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: palisade-server
spec:
  secretName: palisade-server-tls
  dnsNames:
    - palisade-server.palisade.svc
  ipAddresses:
    - 10.0.0.1
  issuerRef:
    name: palisade-ca-issuer
    kind: ClusterIssuer
